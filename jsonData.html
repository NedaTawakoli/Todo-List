<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;">
    <div id="continer"></div>
</body>
</html>
<script>
   const parent = document.getElementById('continer');
   async function fetchData(){
  const UsersInfo = await fetch("https://jsonplaceholder.typicode.com/users");
   const response = await  UsersInfo.json();
   for(let user of response){
    const name = document.createElement('h1');
    const userName = document.createElement('h2');
    const email = document.createElement('h3');
    const phone = document.createElement('a');
    phone.setAttribute('href',`tel:${user.phone}`);
    name.textContent = user.name;
    userName.textContent = user.username;
    email.textContent = user.email;
    phone.textContent = user.phone;
    const div = document.createElement('div');
    div.append(name,userName,email,phone);
    div.style.cssText = "width:60%;margin:15px auto;padding:10px; box-shadow:8px 8px 25px purple;color:purple; text-align:center;gap:20px"
    parent.appendChild(div);
   }
   }
   fetchData();
</script>
